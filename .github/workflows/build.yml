name: Compiler et vérifier CITIZEN MENU

on:
  push:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler le mod
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Préparer l'EULA pour le test local CI
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
      - name: Test de démarrage du serveur dédié
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 60s ./gradlew runServer --no-daemon
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 143 ]; then
            echo "Le serveur dédié s'est arrêté avec le code $status"
            exit "$status"
          fi
          LOG="run/logs/latest.log"
          if [ ! -f "$LOG" ]; then
            echo "Le journal du serveur dédié est introuvable : $LOG"
            find run -maxdepth 4 -type f -name '*.log' -print || true
            exit 1
          fi
          if ! grep -E 'Done \(' "$LOG"; then
            echo "Le serveur n'a pas atteint l'état Done."
            tail -n 120 "$LOG"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: citizen-menu-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publier le .jar sur une version principale
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CITIZEN MENU (build ${{ github.run_number }})
          body: |
            CITIZEN MENU pour Minecraft 1.21.1 / NeoForge 21.1.215 / Java 21.
            Installer le JAR côté client et côté serveur.
            CitizenVoice n'est pas modifié.
          files: build/libs/citizenhub-*.jar
          make_latest: true
