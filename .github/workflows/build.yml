name: Compiler le JAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: citizenhub-jar
          path: build/libs/*.jar
      - name: Publier le .jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Citizen Hub (build ${{ github.run_number }})
          body: |
            À mettre dans le dossier mods du serveur ET dans Citizen Updater (joueurs PC).
            Les joueurs console (Citizen Bedrock) n'ont rien à installer : /citizen s'ouvre en menu Xbox.
          files: build/libs/citizenhub-*.jar
          make_latest: true
