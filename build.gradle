plugins {
    id 'java-library'
    id 'idea'
    // Si tes autres mods Citizen compilent avec une autre version 2.0.x de ModDevGradle,
    // mets la même ici (ça ne change PAS la version de NeoForge).
    id 'net.neoforged.moddev' version '2.0.80'
}

version = mod_version
group = 'fr.citizen.hub'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Version imposée : NeoForge 21.1.215 exactement
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
